name: Sunset notification dispatch

# Runs the evening dispatch — but only during hours that actually need one.
#
# The gate matters more than the cron. Render's free tier spins down after 15
# minutes idle, so every call to the backend costs ~15 instance-minutes
# whether or not there was anything to send. This job therefore reads
# .github/dispatch-schedule.json (committed by the planner workflow) and exits
# WITHOUT touching the backend outside the scheduled hours. GitHub Actions
# minutes are free on a public repo; Render instance-hours are not.
#
# Hourly is safe because a subscriber's window is at least MIN_LEAD_MINUTES
# (60) wide, so no window can open and close between two checks.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Call the backend even outside the scheduled hours"
        type: boolean
        default: false

concurrency:
  # Two overlapping runs would each wake the service and duplicate the scan.
  group: sunset-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Is this hour scheduled?
        id: gate
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          FILE=.github/dispatch-schedule.json

          if [ "${FORCE:-false}" = "true" ]; then
            echo "Forced by workflow_dispatch."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -f "$FILE" ]; then
            # The planner has not run yet. Proceed rather than stay silent
            # forever — a missing schedule must not mean missing alerts.
            echo "::warning::No schedule file yet; running anyway."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The hour and the filename go in through the environment, never
          # interpolated into the source: "09" pasted into a Python literal is
          # a SyntaxError, and the gate would then silently skip 09:00 UTC
          # forever with no failure to notice.
          HOUR=$(date -u +%H)
          if HOUR="$HOUR" FILE="$FILE" python3 -c "
          import json, os, sys
          hours = json.load(open(os.environ['FILE'])).get('cron_hours', [])
          sys.exit(0 if int(os.environ['HOUR']) in hours else 1)
          "; then
            echo "Hour ${HOUR}:00 UTC is scheduled."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Hour ${HOUR}:00 UTC has no open alert window — leaving the backend asleep."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Call the dispatch endpoint
        if: steps.gate.outputs.run == 'true'
        env:
          API_URL: ${{ secrets.BACKEND_URL }}
          DISPATCH_SECRET: ${{ secrets.NOTIFY_DISPATCH_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${API_URL:-}" ] || [ -z "${DISPATCH_SECRET:-}" ]; then
            echo "::error::BACKEND_URL and NOTIFY_DISPATCH_SECRET must be set as repository secrets."
            exit 1
          fi

          # A sleeping Render service can take ~60s to wake, so allow a long
          # first connection and retry rather than failing the whole evening.
          response=$(curl --silent --show-error \
            --location \
            --request POST "$API_URL/notifications/dispatch" \
            --header "X-Dispatch-Secret: $DISPATCH_SECRET" \
            --max-time 180 \
            --retry 3 \
            --retry-delay 20 \
            --retry-all-errors \
            --write-out "\n%{http_code}")

          body=$(echo "$response" | sed '$d')
          code=$(echo "$response" | tail -n1)

          echo "HTTP $code"
          echo "$body"

          if [ "$code" != "200" ]; then
            echo "::error::Dispatch failed with HTTP $code"
            exit 1
          fi
